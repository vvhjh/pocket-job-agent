<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><link rel="apple-touch-icon" href="static/icon.svg"><title>Pocket Job Agent</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none}header{padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 18px max(18px,env(safe-area-inset-left));background:#111827;color:#fff}.wrap{max-width:760px;margin:auto;padding:14px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left))}.card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px #1720330a}h1,h2,h3{margin:0 0 10px}h1{font-size:24px;letter-spacing:-.3px}h2{font-size:17px}h3{font-size:16px;padding-right:62px}label{display:block;font-size:13px;margin:12px 0 5px;color:#526078;font-weight:600}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;min-height:44px;padding:10px 11px;border:1px solid #d5dce7;border-radius:10px;background:#fff;font-size:16px;color:#172033}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus,select:focus{outline:3px solid #bfdbfe;border-color:#2563eb}button{min-height:44px;border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;touch-action:manipulation}.secondary{background:#e8eefb;color:#1d4ed8}.danger{background:#fee2e2;color:#991b1b}.actions,.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.job{border-top:1px solid #e4e8ef;padding:16px 0}.job:first-child{border:0;padding-top:0}.meta{color:#64748b;font-size:13px;line-height:1.5}.score{float:right;background:#dcfce7;color:#166534;border-radius:20px;padding:5px 8px;font-size:12px;font-weight:800}a{color:#1d4ed8;overflow-wrap:anywhere;display:inline-block;padding:7px 0}.notice{font-size:13px;color:#64748b;line-height:1.5}.hidden{display:none}@media(max-width:420px){.wrap{padding-top:10px}.card{padding:14px}.row{display:block}.row>div+div{margin-top:12px}.actions>button{flex:1}.job .actions{display:grid;grid-template-columns:1fr 1fr}.job .actions button{min-width:0;padding-inline:8px}}
</style></head><body><header><h1>⚡ Pocket Job Agent</h1><div class="meta" style="color:#cbd5e1">Free, private job tracker — saved on this device</div></header><main class="wrap">
<section class="card"><h2>Job profile</h2><label>Target roles</label><input id="roles"><label>Skills</label><textarea id="skills"></textarea><label>Locations</label><input id="locations"><div class="actions" style="margin-top:10px"><button onclick="saveProfile()">Save profile</button></div></section>
<section class="card"><h2>Add a job</h2><label>Job title *</label><input id="title" placeholder="Azure Data Engineer"><div class="row"><div><label>Company</label><input id="company"></div><div><label>Location</label><input id="location" placeholder="Remote / Mumbai"></div></div><label>Job URL *</label><input id="url" type="url" placeholder="https://..."><label>Description / skills</label><textarea id="description"></textarea><label>Portal</label><input id="source" placeholder="LinkedIn, Naukri, company site"><div class="actions" style="margin-top:10px"><button onclick="addJob()">Score & save</button></div></section>
<section class="card"><div class="actions" style="justify-content:space-between;align-items:center"><h2>Your jobs</h2><select id="filter" style="width:auto" onchange="render()"><option value="All">All</option><option>Saved</option><option>Ready to apply</option><option>Applied</option><option>Interview</option><option>Rejected</option><option>Skipped</option></select></div><div id="jobs"></div></section><p class="notice">Data is stored only in this browser. Do not clear site data if you want to keep it. This free version has no cloud sync or automatic applications.</p></main>
<script>
const PK='pja-profile',JK='pja-jobs',D={roles:'Data Engineer, Azure Data Engineer, Big Data Engineer, MLOps Engineer',skills:'Python, SQL, PySpark, Spark, ETL, Azure, AWS, GCP, Airflow, Databricks',locations:'India, Remote, Mumbai, Pune'};const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),v=id=>document.getElementById(id).value.trim(),e=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let profile=get(PK,D),jobs=get(JK,[]);function words(s){return s.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean)}function score(j){let t=j.title.toLowerCase(),d=j.description.toLowerCase(),l=j.location.toLowerCase(),r=words(profile.roles),s=words(profile.skills),a=words(profile.locations),n=r.some(x=>t.includes(x))?40:r.some(x=>x.split(' ').some(y=>t.includes(y)))?20:0;n+=s.length?Math.min(40,Math.round(40*s.filter(x=>t.includes(x)||d.includes(x)).length/s.length)):0;if(a.some(x=>l.includes(x)))n+=15;if(j.url.startsWith('https://'))n+=5;return Math.min(100,n)}function saveProfile(){profile={roles:v('roles'),skills:v('skills'),locations:v('locations')};put(PK,profile);jobs=jobs.map(j=>({...j,score:score(j)}));put(JK,jobs);render()}function addJob(){if(!v('title')||!v('url'))return alert('Enter a job title and URL.');if(jobs.some(j=>j.url===v('url')))return alert('That URL is already saved.');let j={id:crypto.randomUUID?crypto.randomUUID():Date.now(),title:v('title'),company:v('company'),location:v('location'),url:v('url'),description:v('description'),source:v('source')||'Manual',status:'Saved',created:new Date().toISOString()};j.score=score(j);jobs.push(j);put(JK,jobs);['title','company','location','url','description','source'].forEach(id=>document.getElementById(id).value='');render()}function status(id,x){let j=jobs.find(j=>j.id===id);j.status=x;put(JK,jobs);render()}function del(id){if(confirm('Delete this job?')){jobs=jobs.filter(j=>j.id!==id);put(JK,jobs);render()}}function render(){let f=v('filter'),list=jobs.filter(j=>f==='All'||j.status===f).sort((a,b)=>b.score-a.score);document.getElementById('jobs').innerHTML=list.length?list.map(j=>`<article class="job"><span class="score">${j.score}/100</span><h3>${e(j.title)}</h3><div class="meta">${e(j.company||'Company not entered')} · ${e(j.location||'Location not entered')} · ${e(j.source)}</div><p>${e(j.description.slice(0,220)||'No description added')}</p><a href="${e(j.url)}" target="_blank" rel="noopener">Open job posting ↗</a><label>Status</label><select onchange="status('${j.id}',this.value)">${['Saved','Ready to apply','Applied','Interview','Rejected','Skipped'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select><div class="actions" style="margin-top:9px"><button class="secondary" onclick="status('${j.id}','Ready to apply')">Mark ready</button><button class="danger" onclick="del('${j.id}')">Delete</button></div></article>`).join(''):'<p class="notice">No jobs yet. Add your first listing above.</p>'}['roles','skills','locations'].forEach(id=>document.getElementById(id).value=profile[id]||'');render();
</script></body></html>
